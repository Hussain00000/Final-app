{"name":"Build APK","on":["push","workflow_dispatch"],"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Unzip project","run":"unzip -q -o \"$(ls *.zip | head -n 1)\""},{"name":"Apply build fixes","run":"cd MyDeenAndroid && printf '\\nandroid {\\n    compileOptions {\\n        sourceCompatibility = JavaVersion.VERSION_17\\n        targetCompatibility = JavaVersion.VERSION_17\\n    }\\n    kotlinOptions { jvmTarget = \"17\" }\\n}\\n' >> app/build.gradle.kts && sed -i -e 's#mutableStateOf(prefs.getBoolean(valueKey, false))#mutableStateOf(if (item.kind == \"check\") prefs.getBoolean(valueKey, false) else false)#' -e 's#mutableIntStateOf(prefs.getInt(valueKey, 0))#mutableIntStateOf(if (item.kind == \"check\") 0 else prefs.getInt(valueKey, 0))#' app/src/main/java/com/example/mydeen/MainActivity.kt"},{"name":"Build debug APK","working-directory":"MyDeenAndroid","run":"gradle assembleDebug --no-daemon"},{"name":"Publish APK","env":{"GH_TOKEN":"${{ github.token }}"},"run":"cp MyDeenAndroid/app/build/outputs/apk/debug/app-debug.apk MyDeen.apk && gh release create build-${{ github.run_number }} MyDeen.apk --title \"My Deen build ${{ github.run_number }}\" --notes \"Debug APK\""}]}}}

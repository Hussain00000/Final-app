name: Build My Deen APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout (for debugging)
        run: |
          pwd
          ls -la
          find . -maxdepth 3 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -not -path "./.git/*"

      - name: Locate Android project
        id: loc
        run: |
          G=$(find . -maxdepth 3 -name gradlew -not -path "./.git/*" | head -n1)
          if [ -z "$G" ]; then
            echo "::error::No gradlew found. Upload your full Android Studio project (with gradlew, gradle/ folder, settings.gradle, app/) to this repo."
            exit 1
          fi
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyDeen-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

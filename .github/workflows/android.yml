name: Build My Deen APK and Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find or unpack the project
        id: proj
        run: |
          ZIP=$(ls MyDeenAndroid-v*.zip 2>/dev/null | sed -E 's/^MyDeenAndroid-v([0-9]+).*/\1 &/' | sort -n | tail -n 1 | cut -d' ' -f2-)
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            rm -rf proj && mkdir proj
            unzip -q "$ZIP" -d proj
            SETTINGS=$(find proj -name settings.gradle.kts | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::No settings.gradle.kts found inside $ZIP"

{"name":"Build APK","on":["push","workflow_dispatch"],"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Unzip newest project zip","run":"unzip -q -o \"$(ls *.zip | LC_ALL=C sort -V | tail -n 1)\""},{"name":"Build debug APK","working-directory":"MyDeenAndroid","run":"gradle assembleDebug --no-daemon"},{"name":"Publish APK","env":{"GH_TOKEN":"${{ github.token }}"},"run":"cp MyDeenAndroid/app/build/outputs/apk/debug/app-debug.apk MyDeen.apk && gh release create build-${{ github.run_number }} MyDeen.apk --title \"My Deen build ${{ github.run_number }}\" --notes \"Debug APK\""}]}}}
